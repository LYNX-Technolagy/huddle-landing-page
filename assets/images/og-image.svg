<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="orangeWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F56A00" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F56A00" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F7F5F0"/>
  <rect width="1200" height="630" fill="url(#orangeWash)"/>

  <!-- Top manga speed lines (thick → thin) -->
  <g stroke="#1A1A1A" opacity="0.08">
    <line x1="-50" y1="70" x2="1250" y2="70" stroke-width="3"/>
    <line x1="-50" y1="95" x2="900" y2="95" stroke-width="2"/>
    <line x1="-50" y1="115" x2="1100" y2="115" stroke-width="1"/>
  </g>

  <!-- Bottom manga speed lines -->
  <g stroke="#1A1A1A" opacity="0.08">
    <line x1="-50" y1="515" x2="1100" y2="515" stroke-width="1"/>
    <line x1="-50" y1="535" x2="900" y2="535" stroke-width="2"/>
    <line x1="-50" y1="560" x2="1250" y2="560" stroke-width="3"/>
  </g>

  <!-- Manga panel border — thin ink frame -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1A1A1A" stroke-width="4"/>

  <!-- Eyebrow — top-left, orange + ink tag -->
  <g transform="translate(80, 90)">
    <rect x="0" y="-14" width="8" height="20" fill="#F56A00"/>
    <text x="20" y="2"
          font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="17"
          font-weight="800"
          fill="#1A1A1A"
          letter-spacing="5">BETA 1 — NOW OPEN</text>
  </g>

  <!-- HUDDLE wordmark — the hero -->
  <text x="600" y="330"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="200"
        font-weight="900"
        fill="#1A1A1A"
        text-anchor="middle"
        letter-spacing="-6">HUDDLE</text>

  <!-- Orange bar — underline, Haikyū signature -->
  <rect x="380" y="360" width="440" height="12" fill="#F56A00"/>

  <!-- Tagline beneath bar -->
  <text x="600" y="420"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="26"
        font-weight="700"
        fill="#1A1A1A"
        text-anchor="middle"
        letter-spacing="10">FIND YOUR GAME</text>

  <!-- Bottom-left: domain badge -->
  <g transform="translate(80, 530)">
    <rect x="0" y="0" width="380" height="40" fill="#1A1A1A"/>
    <text x="190" y="26"
          font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="14"
          font-weight="800"
          fill="#F7F5F0"
          text-anchor="middle"
          letter-spacing="3">JOINHUDDLEUP.NETLIFY.APP</text>
  </g>

  <!-- Bottom-right: sports + SA tag -->
  <text x="1120" y="556"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13"
        font-weight="700"
        fill="#555555"
        text-anchor="end"
        letter-spacing="4">VOLLEYBALL · SOCCER · BASKETBALL · TENNIS</text>
</svg>