<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <!-- Background -->
  <rect width="600" height="200" fill="#F7F5F0"/>

  <!-- Manga speed lines -->
  <g stroke="#1A1A1A" opacity="0.06">
    <line x1="-50" y1="30" x2="650" y2="30" stroke-width="2"/>
    <line x1="-50" y1="50" x2="500" y2="50" stroke-width="1"/>
    <line x1="-50" y1="170" x2="500" y2="170" stroke-width="1"/>
    <line x1="-50" y1="185" x2="650" y2="185" stroke-width="2"/>
  </g>

  <!-- Orange accent bar top -->
  <rect x="0" y="0" width="600" height="6" fill="#F56A00"/>

  <!-- Manga panel border -->
  <rect x="16" y="16" width="568" height="168" fill="none" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Corner accents -->
  <g fill="#1A1A1A">
    <rect x="16" y="16" width="14" height="14"/>
    <rect x="570" y="16" width="14" height="14"/>
    <rect x="16" y="170" width="14" height="14"/>
    <rect x="570" y="170" width="14" height="14"/>
  </g>

  <!-- Small eyebrow -->
  <text x="300" y="62"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="11"
        font-weight="800"
        fill="#F56A00"
        text-anchor="middle"
        letter-spacing="4">VERIFY YOUR ACCOUNT</text>

  <!-- HUDDLE wordmark -->
  <text x="300" y="130"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="72"
        font-weight="900"
        fill="#1A1A1A"
        text-anchor="middle"
        letter-spacing="-2">HUDDLE</text>

  <!-- Orange underline -->
  <rect x="230" y="142" width="140" height="5" fill="#F56A00"/>

  <!-- Sub-tagline -->
  <text x="300" y="172"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="10"
        font-weight="700"
        fill="#555555"
        text-anchor="middle"
        letter-spacing="6">FIND YOUR GAME</text>
</svg>